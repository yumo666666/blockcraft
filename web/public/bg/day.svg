<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#9cc9f7"/>
      <stop offset="0.3" stop-color="#c2dfff"/>
      <stop offset="0.58" stop-color="#e9f3ff"/>
      <stop offset="0.78" stop-color="#fdf1e2"/>
      <stop offset="1" stop-color="#ffdec6"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffdf4" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#fff6d5" stop-opacity="0.55"/>
      <stop offset="0.62" stop-color="#ffeec2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloud" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0dd" stop-opacity="0.72"/>
      <stop offset="0.6" stop-color="#ffe6cc" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffe6cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eaf4ff" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#d8e9ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#d8e9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7d2d7"/>
      <stop offset="1" stop-color="#9dbec7"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#98bcc6"/>
      <stop offset="1" stop-color="#7fa7b5"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1df" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#ffeedb" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff4e6" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9eef8"/>
      <stop offset="0.35" stop-color="#c0dfee"/>
      <stop offset="1" stop-color="#8ab6d1"/>
    </linearGradient>
    <radialGradient id="reflection" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6e3" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ffe9cf" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffe9cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.52" stop-color="#4c708c" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#4c708c" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#3b5a73" stop-opacity="0.24"/>
    </radialGradient>
    
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#sky)"/>
  <ellipse cx="1530" cy="214" rx="520" ry="520" fill="url(#sun)" opacity="1"/>
  <ellipse cx="1540" cy="212" rx="86" ry="86" fill="url(#sun)" opacity="0.9"/>

  <ellipse cx="340" cy="292" rx="400" ry="132" fill="url(#cloud)" opacity="1" transform="rotate(-4 340 292)"/>
  <ellipse cx="620" cy="386" rx="320" ry="96" fill="url(#cloud)" opacity="0.9" transform="rotate(3 620 386)"/>
  <ellipse cx="1230" cy="462" rx="420" ry="100" fill="url(#cloudWarm)" opacity="1" transform="rotate(-2 1230 462)"/>
  <ellipse cx="880" cy="238" rx="260" ry="74" fill="url(#cloud)" opacity="0.8" transform="rotate(5 880 238)"/>
  <ellipse cx="1660" cy="556" rx="360" ry="86" fill="url(#cloudWarm)" opacity="1" transform="rotate(2 1660 556)"/>
  <ellipse cx="210" cy="520" rx="340" ry="100" fill="url(#cloudBlue)" opacity="1" transform="rotate(-3 210 520)"/>
  <ellipse cx="1080" cy="596" rx="470" ry="90" fill="url(#cloudWarm)" opacity="0.9"/>
  <ellipse cx="1440" cy="352" rx="260" ry="70" fill="url(#cloudBlue)" opacity="0.8" transform="rotate(-6 1440 352)"/>

  <polygon points="0,700 140,660 300,676 450,640 610,668 760,630 920,660 1080,626 1240,656 1400,632 1560,662 1720,640 1920,668 1920,780 0,780" fill="url(#hillFar)" opacity="0.85"/>
  <polygon points="0,742 180,716 360,738 540,710 720,734 900,706 1090,730 1270,704 1460,728 1640,710 1820,732 1920,720 1920,800 0,800" fill="url(#hillNear)" opacity="0.92"/>
  <rect y="570" width="100%" height="160" fill="url(#haze)"/>

  <rect y="700" width="100%" height="380" fill="url(#water)"/>
  <ellipse cx="1520" cy="850" rx="380" ry="170" fill="url(#reflection)" opacity="1"/>
  <ellipse cx="960" cy="950" rx="880" ry="30" fill="url(#reflection)" opacity="0.5"/>
  <ellipse cx="1010" cy="1040" rx="700" ry="20" fill="url(#reflection)" opacity="0.32"/>

  <rect width="100%" height="100%" fill="url(#vignette)"/>
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.04"/>
</svg>
