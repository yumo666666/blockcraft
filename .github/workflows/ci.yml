name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.2

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（前端 + 后端，必须 0 错误）
        run: pnpm typecheck

      - name: 构建前端
        run: pnpm build

      - name: 测试
        # 没有跑着的面板时，页面渲染测试会自动跳过，只跑纯逻辑测试
        run: pnpm test

      - name: 服务端跨平台启动参数检查
        run: pnpm test:server

      - name: 编译 Windows 托盘启动器
        working-directory: packaging/windows
        run: |
          trap 'rm -f blockcraft_windows_amd64.syso' EXIT
          go run github.com/akavel/rsrc@v0.10.2 -ico blockcraft.ico -o blockcraft_windows_amd64.syso -arch amd64
          GOOS=windows GOARCH=amd64 go build -mod=readonly -trimpath -o /tmp/BlockCraft.exe .
